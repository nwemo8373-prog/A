<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEGM • ULTRA DEEP CORE INTERFACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ff1a4e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 10px;
        }

        /* خلفية سينمائية مرعبة مع تأثيرات شعاعية ومسح */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 99;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(120, 0, 20, 0.2) 0%, rgba(0, 0, 0, 0.95) 80%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 100;
            background: rgba(5, 5, 8, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 0, 60, 0.4);
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 0 50px rgba(255, 0, 60, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
            width: 100%;
            max-width: 440px;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 0, 60, 0.3);
            padding-bottom: 12px;
        }

        h2 {
            font-size: 20px;
            font-weight: 900;
            color: #ff003c;
            text-shadow: 0 0 15px rgba(255, 0, 60, 0.8);
            letter-spacing: 1.5px;
        }

        .status-bar {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: #00ffcc;
            margin-top: 4px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: 700;
            color: #d4d4d8;
            letter-spacing: 0.5px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 0, 60, 0.3);
            background-color: #030305;
            color: #00ffcc;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Share Tech Mono', monospace;
        }

        select:focus, input[type="text"]:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        select option {
            background-color: #050508;
            color: #00ffcc;
        }

        .preview-box {
            background: #010103;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 6px;
            font-size: 10px;
            color: #a1a1aa;
            max-height: 90px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
            font-family: 'Share Tech Mono', monospace;
            margin-bottom: 14px;
        }

        /* أزرار التحكم المرعبة */
        .btn-exec {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #cc0033, #660019);
            color: white;
            border: 1px solid #ff003c;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(204, 0, 51, 0.5);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .btn-exec:active {
            transform: scale(0.98);
        }

        .btn-sos {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            color: #ff3366;
            border: 1px dashed #ff003c;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: block;
            box-shadow: inset 0 0 10px rgba(255, 0, 60, 0.15);
        }

        .btn-sos:hover {
            background: #ff003c;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.7);
        }

        .terminal-output {
            margin-top: 12px;
            background: #000;
            border: 1px solid #00ffcc;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: #00ffcc;
            display: none;
            max-height: 110px;
            overflow-y: auto;
        }

        .footer-note {
            margin-top: 12px;
            font-size: 9px;
            text-align: center;
            color: #52525b;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
        }
    </style>
</head>
